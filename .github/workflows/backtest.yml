name: Backtest

on:
  workflow_dispatch:
  schedule:
    - cron: "17 1 * * 0"  # tiap Minggu 08:17 WIB

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r trading/requirements.txt
      - run: python trading/backtest.py
      - name: Simpan laporan
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add trading/report.html
          git diff --cached --quiet || git commit -m "Update backtest report"
          git push
